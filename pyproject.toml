[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kokki-kumar"
version = "0.1.0"
description = "Personal AI system assistant"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["kokki*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
